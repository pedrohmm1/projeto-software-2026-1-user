name: Python application

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r requirements.txt

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "pedrohmm1"
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: pedrohmm1/app_users-ci:${{ github.sha }}

      - name: Deploy on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_TEST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST }}
          port: 22
          script: |
            echo "=== Containers em execução ==="
            docker ps || true

            echo "=== Processos usando a porta 80 ==="
            sudo lsof -i :80 || true
            sudo ss -ltnp '( sport = :80 )' || true

            echo "=== Removendo container app_users antigo ==="
            docker stop app_users || true
            docker rm -f app_users || true

            echo "=== Removendo containers Docker que usam a porta 80 ==="
            docker stop $(docker ps -q --filter "publish=80") || true
            docker rm -f $(docker ps -aq --filter "publish=80") || true

            echo "=== Parando serviços comuns na porta 80 ==="
            sudo systemctl stop nginx || true
            sudo systemctl stop apache2 || true

            echo "=== Forçando liberação da porta 80 ==="
            sudo fuser -k 80/tcp || true

            echo "=== Baixando imagem nova ==="
            docker pull pedrohmm1/app_users-ci:${{ github.sha }}

            echo "=== Subindo novo container ==="
            docker run -d \
              --name app_users \
              -e POSTGRES_URL=postgres-users \
              -e POSTGRES_USER=${{ secrets.POSTGRES_USER }} \
              -e POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
              --network=rede \
              -p 80:5003 \
              pedrohmm1/app_users-ci:${{ github.sha }}

            echo "=== Containers após deploy ==="
            docker ps || true